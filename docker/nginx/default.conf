fastcgi_cache_path /tmp/nginx_cache levels=1:2 keys_zone=LARAVEL:100m inactive=60m;
fastcgi_cache_key "$scheme$request_method$host$request_uri";
fastcgi_ignore_headers Cache-Control Expires Set-Cookie;

server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/public;

    # Skip cache for POST, auth routes, and Livewire
    set $skip_cache 0;
    if ($request_method = POST) { set $skip_cache 1; }
    if ($cookie_laravel_session) { set $skip_cache 1; }
    if ($request_uri ~* "/livewire|/cart|/checkout|/orders|/wishlist|/admin") {
        set $skip_cache 1;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_cache LARAVEL;
        fastcgi_cache_valid 200 30s;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location ~ /\.ht {
        deny all;
    }

    location /fpm-status {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        allow 127.0.0.1;
        allow 172.0.0.0/8; 
        deny all;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}